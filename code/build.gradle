plugins { id 'com.android.application' }

android {
    namespace 'com.jeep.claudecode'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jeep.claudecode'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '0.3.6'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('CLAUDE_KEYSTORE_FILE') ?: 'missing.jks')
            storePassword System.getenv('CLAUDE_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'claude'
            keyPassword System.getenv('CLAUDE_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            // ScreensTest: -Dshots=<dir>; offline Robolectric jars: -Drobolectric.offline=true -Drobolectric.dependency.dir=<dir>
            all { test ->
                ['shots', 'robolectric.offline', 'robolectric.dependency.dir'].each { k ->
                    if (System.getProperty(k)) test.systemProperty k, System.getProperty(k)
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // Markdown in native TextViews.
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
}
