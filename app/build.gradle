plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jeep.claude'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jeep.claude'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('CLAUDE_KEYSTORE_FILE') ?: 'release-key.jks')
            storePassword System.getenv('CLAUDE_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('CLAUDE_KEY_ALIAS') ?: 'claude'
            keyPassword System.getenv('CLAUDE_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // Installable alongside v1 and the signed v2 release for testing.
            applicationIdSuffix '.preview'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.7.0'
}
