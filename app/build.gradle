plugins { id 'com.android.application' }

android {
    namespace 'com.jeep.claude'
    compileSdk 34
    defaultConfig {
        // Same application id and signing key as the installed app, so it updates in place.
        applicationId 'com.jeep.claude'
        minSdk 26
        targetSdk 34
        versionCode 35
        versionName '4.0.4'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('CLAUDE_KEYSTORE_FILE') ?: 'missing.jks')
            storePassword System.getenv('CLAUDE_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'claude'
            keyPassword System.getenv('CLAUDE_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
