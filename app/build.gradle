plugins { id 'com.android.application' }

android {
    namespace 'com.jeep.claude'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jeep.claude'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '3.0.11'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('CLAUDE_KEYSTORE_FILE') ?: 'missing.jks')
            storePassword System.getenv('CLAUDE_KEYSTORE_PASSWORD') ?: ''
            keyAlias 'claude'
            keyPassword System.getenv('CLAUDE_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebView compatibility APIs: document-start script and X-Requested-With opt-out.
    implementation 'androidx.webkit:webkit:1.8.0'
}
