name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test page script
        run: node tests/claude-page.cjs
      - name: Check Claude Code app sources
        run: |
          python3 -c "import ast; ast.parse(open('code/src/main/assets/bridge.py').read())"
      - name: Userland id for the Claude Code app
        run: echo "RUNTIME_ID=$(cat code/runtime/*.sh | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: userland
        with:
          path: userland
          key: userland-${{ env.RUNTIME_ID }}
      - name: Build the userland (Alpine, Claude Code, proot)
        if: steps.userland.outputs.cache-hit != 'true'
        run: |
          mkdir -p userland
          sudo code/runtime/build-rootfs.sh aarch64 userland/rootfs.tar.xz
          code/runtime/fetch-proot.sh userland
      - name: Put the userland in the app
        run: |
          mkdir -p code/src/main/assets/runtime
          cp userland/* code/src/main/assets/runtime/
          echo "$RUNTIME_ID" > code/src/main/assets/runtime/id
          ls -l code/src/main/assets/runtime
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build signed release APK
        env:
          KEY_B64: ${{ secrets.CLAUDE_KEYSTORE_B64 }}
          CLAUDE_KEYSTORE_PASSWORD: ${{ secrets.CLAUDE_KEYSTORE_PASSWORD }}
          CLAUDE_KEY_PASSWORD: ${{ secrets.CLAUDE_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/app.jks"
          export CLAUDE_KEYSTORE_FILE="$RUNNER_TEMP/app.jks"
          gradle --no-daemon :app:assembleRelease :code:assembleRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify code/build/outputs/apk/release/code-release.apk
          VERSION=$(sed -n "s/^ *versionName '\(.*\)'.*/\1/p" app/build.gradle)
          CODE_VERSION=$(sed -n "s/^ *versionName '\(.*\)'.*/\1/p" code/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE_VERSION=$CODE_VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Claude-v$VERSION.apk"
          cp code/build/outputs/apk/release/code-release.apk "out/ClaudeCode-v$CODE_VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: claude-v${{ env.VERSION }}
          path: out/Claude-v${{ env.VERSION }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: claude-code-v${{ env.CODE_VERSION }}
          path: out/ClaudeCode-v${{ env.CODE_VERSION }}.apk
      - name: Publish release for main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; bump versionName to publish."
          else
            gh release create "v$VERSION" "out/Claude-v$VERSION.apk" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Claude v$VERSION" --notes "Claude in a plain Android WebView."
          fi
