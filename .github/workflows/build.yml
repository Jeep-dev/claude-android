name: Build Claude Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} output/Claude-App.apk \; || find app/build/outputs/apk -name "*.apk" -exec cp {} output/Claude-App.apk \;
          ls -lh output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Android-APK
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Claude Android App
          tag_name: latest
          files: output/*.apk
          draft: false
          prerelease: false
          body: |
            ## Claude Android WebApp (Safe Sandbox Edition)
            - 🛡️ **严格沙盒隔离**：零敏感权限（无 SIM 卡读取、无基站、无 WiFi SSID、无地理位置）。
            - 🔙 **侧滑手势优化**：侧滑直接退出应用回到桌面，绝不困在网页路由历史里。
            - 🔑 **支持 Google 一键登录**：定制 User-Agent 规避 Google 403 `disallowed_useragent`。
            - 📦 **开箱即用**：由 GitHub Actions 自动化编译打包。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
