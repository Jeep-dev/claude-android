name: Build Claude Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Restore persistent signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.CLAUDE_KEYSTORE_B64 }}
        run: |
          test -n "$SIGNING_KEY_B64" || { echo 'Missing signing key'; exit 1; }
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/claude-release.jks"
          chmod 600 "$RUNNER_TEMP/claude-release.jks"

      - name: Build signed release
        env:
          CLAUDE_KEYSTORE_FILE: ${{ runner.temp }}/claude-release.jks
          CLAUDE_KEYSTORE_PASSWORD: ${{ secrets.CLAUDE_KEYSTORE_PASSWORD }}
          CLAUDE_KEY_ALIAS: claude
          CLAUDE_KEY_PASSWORD: ${{ secrets.CLAUDE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and publish APK artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/Claude-App-v2.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose output/Claude-App-v2.apk
          if "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions output/Claude-App-v2.apk | grep -q '^uses-permission:'; then
            echo 'Unexpected permission in APK'; exit 1
          fi
          sha256sum output/Claude-App-v2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-App-v2
          path: output/Claude-App-v2.apk
          retention-days: 30
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Claude Android v2.0.0
          files: output/Claude-App-v2.apk
          body: |
            Rebuilt browser-backed launcher for claude.ai.
            Google sign-in happens in the user's browser, not an embedded WebView.
            The launcher requests no Android permissions. Browser permissions,
            network routing and in-browser back navigation remain browser-controlled.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
