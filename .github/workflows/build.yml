name: Build Claude Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK with Gradle
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk output/Claude-App-v1.0.0.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk output/Claude-App-v1.0.0.apk
          fi
          ls -lh output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Android-APK
          path: output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Claude Android WebApp v1.0.0
          tag_name: v1.0.0
          files: output/*.apk
          draft: false
          prerelease: false
          body: |
            ## Claude Android WebApp (Safe Sandbox Edition)
            - 🛡️ **严格沙盒隔离**：零敏感权限（无 SIM 卡读取、无基站、无 WiFi SSID、无地理位置）。
            - ⚡ **原生体验**：沉浸式暗色界面、原生手势返回、下拉刷新、图片/文档附件上传支持。
            - 🔑 **支持 Google 一键登录**：优化 User-Agent 绕过 Google 403 `disallowed_useragent` 限制。
            - 📦 **免安装配置**：APK 由 GitHub Actions 自动化编译打包。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
